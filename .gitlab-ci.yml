# Docusaurus statik sitesini derleyip GitLab Pages'e yayınlar.
# Bu dosyanın varlığı Auto DevOps'u (buildpack + docker-in-docker) devre dışı bırakır;
# statik site için Docker'a/dind'e gerek yok.

image: node:20

stages:
  - deploy

# npm cache'i proje içinde tut ki GitLab CI cache'leyebilsin
variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# GitLab Pages job'ı "pages" adında olmalı ve çıktı "public/" klasöründe artifact olmalı.
pages:
  stage: deploy
  script:
    - npm ci
    # Docusaurus varsayılan olarak build/'e yazar; GitLab Pages public/ ister, yönlendiriyoruz.
    - npm run build -- --out-dir public
  artifacts:
    paths:
      - public
  environment:
    name: pages
    url: $CI_PAGES_URL   # Pipeline bitince GitLab arayüzünde tıklanabilir canlı URL gösterir
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # sadece main'e push'ta çalışır
