# =====================================================================
# Lumix campus mono-repo — GitLab CI/CD.
# Kapsam: build + test + statik analiz (gradle check) → commit-lint →
#         distroless image build+push (GitLab Container Registry) → deploy (manuel placeholder).
# Backend job'lari yalnizca backend/ degisince calisir (rules:changes).
#
# TIMING OLCUMU (iki katman):
#   1) Gradle --profile  → task-bazli HTML rapor (backend/build/reports/profile/), artifact.
#   2) metrics.txt (OpenMetrics) → her job'un sure(sn)'si; GitLab MR widget'inda trend gosterir
#      (artifacts:reports:metrics). GitLab'in native job suresi + CI/CD Analytics de ayrica var.
#   Derin/tarihsel analitik istenirse: Develocity (self-host) — bkz. en alttaki not.
#
# NOT: Repodaki .github/workflows/ci.yml GitLab'da CALISMAZ (GitHub Actions) — asil pipeline budur.
# =====================================================================

stages:
  - build
  - security
  - image
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---- Ortak Gradle ayarlari ----
.gradle-backend:
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/gradle/libs.versions.toml
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - cd backend
    - chmod +x ./gradlew

# ---- Timing yardimcisi: verilen komutu wall-clock ile olcup metrics.txt yazar ----
# Kullanim (script icinde):  emit_metric <job_adi> <komut...>
.timing-helper: &timing-helper |
  emit_metric() {
    local job="$1"; shift
    local start end rc
    start=$(date +%s)
    "$@"; rc=$?
    end=$(date +%s)
    mkdir -p "$CI_PROJECT_DIR/metrics"
    {
      echo "# HELP ci_job_duration_seconds CI job wall-clock suresi (saniye)"
      echo "# TYPE ci_job_duration_seconds gauge"
      echo "ci_job_duration_seconds{job=\"${job}\"} $((end - start))"
    } > "$CI_PROJECT_DIR/metrics/${job}.txt"
    echo ">> TIMING ${job}: $((end - start))s (rc=${rc})"
    return $rc
  }

# ---- Backend: derle + test + spotless + checkstyle (+ Gradle --profile) ----
backend:build:
  extends: .gradle-backend
  stage: build
  script:
    - *timing-helper
    - emit_metric backend_build ./gradlew check --profile
  artifacts:
    when: always
    reports:
      junit: backend/**/build/test-results/test/TEST-*.xml
      metrics: metrics/backend_build.txt
    paths:
      - backend/**/build/reports/       # test + checkstyle + spotless raporlari
      - backend/build/reports/profile/  # Gradle --profile: task-bazli timing HTML
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**/*]
    # default branch (main): her zaman calis — main yesil kalmali (changes filtresi YOK)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---- Commit mesaj formati (Conventional Commits) — sadece MR ----
commit-lint:
  stage: build
  image: alpine:3.20
  needs: []
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git grep
  script:
    - |
      types="feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
      pattern="^(${types})(\([a-z0-9._/-]+\))?(!)?: .+"
      fail=0
      base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      for sha in $(git rev-list "$base"..HEAD); do
        subject="$(git log -1 --format=%s "$sha")"
        case "$subject" in
          "!"*|"Merge "*|"Revert "*|"fixup!"*|"squash!"*|"amend!"*) continue ;;
        esac
        if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
          echo "Gecersiz commit mesaji: $subject"
          fail=1
        fi
      done
      if [ "$fail" -ne 0 ]; then
        echo "Commit mesajlari Conventional Commits formatina uymuyor. Ornek: feat(auth): giris akisi"
        exit 1
      fi
      echo "Tum commit mesajlari formata uygun."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---- Protobuf sema dogrulama: lint + breaking-change (buf) — sadece MR ----
# buf = derleme-zamani bekcisi (MR merge olmadan yakalar). Apicurio BACKWARD kurali
# = calisma-zamani bekcisi (register aninda reddeder). Iki katman, bkz. backend/buf.yaml.
schema:validate:
  stage: build
  image: alpine:3.20
  needs: []
  variables:
    GIT_DEPTH: "0"          # buf breaking, hedef dalin gecmisine erismeli
    BUF_VERSION: "1.71.0"
  before_script:
    - apk add --no-cache curl git
    - curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-$(uname -s)-$(uname -m)" -o /usr/local/bin/buf
    - chmod +x /usr/local/bin/buf
    - buf --version
  script:
    # 1) Lint — stil/konvansiyon (backend/buf.yaml kurallari)
    - buf lint backend
    # 2) Breaking-change — MR hedef dalina gore wire-format uyumlulugu
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        echo "Breaking-change kontrolu (base: $CI_MERGE_REQUEST_DIFF_BASE_SHA) ..."
        buf breaking backend --against ".git#ref=${CI_MERGE_REQUEST_DIFF_BASE_SHA},subdir=backend"
      else
        echo "MR degil — breaking kontrolu atlandi."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*.proto
        - backend/buf.yaml

# ---- OWASP dependency-check — manuel (NVD verisi indirir, yavas) ----
backend:dependency-check:
  extends: .gradle-backend
  stage: security
  needs:
    - job: backend:build
      optional: true
  script:
    - *timing-helper
    - emit_metric backend_dependency_check ./gradlew dependencyCheckAggregate
  artifacts:
    when: always
    reports:
      metrics: metrics/backend_dependency_check.txt
    paths:
      - backend/build/reports/dependency-check-report.html
      - backend/build/reports/dependency-check-report.sarif
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# ---- Distroless image build + push (Kaniko) + build timing ----
backend:image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - job: backend:build
      optional: true
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - *timing-helper
    - |
      emit_metric backend_image /kaniko/executor \
        --context "$CI_PROJECT_DIR/backend" \
        --dockerfile "$CI_PROJECT_DIR/backend/service-template/Dockerfile" \
        --destination "$CI_REGISTRY_IMAGE/service-template:$CI_COMMIT_SHORT_SHA" \
        --destination "$CI_REGISTRY_IMAGE/service-template:latest"
  artifacts:
    when: always
    reports:
      metrics: metrics/backend_image.txt
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---- Deploy — PLACEHOLDER (manuel). K8s manifest/helm eklenince doldurulacak. ----
deploy:staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: backend:image
      optional: true
  script:
    - |
      echo "PLACEHOLDER: deploy henuz tanimli degil (K8s manifest/helm chart bekliyor)."
      echo "Push edilen image: $CI_REGISTRY_IMAGE/service-template:$CI_COMMIT_SHORT_SHA"
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# =====================================================================
# DERIN TIMING ANALITIGI (opsiyonel, self-host) — Develocity / Gradle Enterprise:
#   - settings.gradle.kts'e `com.gradle.develocity` plugin'i eklenir.
#   - CI degiskeni DEVELOCITY_URL set edilirse her build bir "Build Scan" yayinlar:
#     task-bazli timing, cache isabet orani, tarihsel trend dashboard'u.
#   - ON-PREM ZORUNLU: build scan'ler public scans.gradle.com'a GITMEMELI (kod gizli).
#     Kendi Develocity sunucunuzu verirseniz wiring'i eklerim.
# =====================================================================
