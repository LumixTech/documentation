# =====================================================================
# Lumix campus mono-repo — GitLab CI/CD.
# Kapsam: build + test + statik analiz (gradle check) → commit-lint →
#         distroless image build+push (GitLab Container Registry) → deploy (manuel placeholder).
# Backend job'lari yalnizca backend/ degisince calisir (rules:changes).
# NOT: Repodaki .github/workflows/ci.yml GitLab'da CALISMAZ (GitHub Actions) — asil pipeline budur.
# =====================================================================

stages:
  - build
  - security
  - image
  - deploy

variables:
  # Gradle cache'i proje icinde tut ki GitLab cache'leyebilsin; daemon CI'da kapali.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"

# MR + default branch + tag disinda pipeline acma (mukerrer pipeline'i onler).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---- Ortak Gradle ayarlari (backend job'lari extend eder) ----
.gradle-backend:
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/gradle/libs.versions.toml
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - cd backend
    - chmod +x ./gradlew

# ---- Backend: derle + test + spotless + checkstyle ----
backend:build:
  extends: .gradle-backend
  stage: build
  script:
    - ./gradlew check
  artifacts:
    when: always
    reports:
      junit: backend/**/build/test-results/test/TEST-*.xml
    paths:
      - backend/**/build/reports/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**/*]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [backend/**/*]
    - if: $CI_COMMIT_TAG

# ---- Commit mesaj formati (Conventional Commits) — sadece MR ----
commit-lint:
  stage: build
  image: alpine:3.20
  needs: []
  variables:
    GIT_DEPTH: "0" # rev-list icin tam gecmis lazim
  before_script:
    - apk add --no-cache git grep
  script:
    - |
      types="feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
      pattern="^(${types})(\([a-z0-9._/-]+\))?(!)?: .+"
      fail=0
      base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      for sha in $(git rev-list "$base"..HEAD); do
        subject="$(git log -1 --format=%s "$sha")"
        case "$subject" in
          # '!' kacis kapisi ve ozel mesajlar (lokal commit-msg hook ile ayni liste)
          "!"*|"Merge "*|"Revert "*|"fixup!"*|"squash!"*|"amend!"*) continue ;;
        esac
        if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
          echo "::Gecersiz commit mesaji: $subject"
          fail=1
        fi
      done
      if [ "$fail" -ne 0 ]; then
        echo "Commit mesajlari Conventional Commits formatina uymuyor."
        echo "Ornek: feat(auth): kullanici giris akisi eklendi"
        exit 1
      fi
      echo "Tum commit mesajlari formata uygun."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---- OWASP dependency-check — manuel (NVD verisi indirir, yavas) ----
# Gerekli CI degiskeni (opsiyonel, rate-limit icin): NVD_API_KEY (masked).
backend:dependency-check:
  extends: .gradle-backend
  stage: security
  needs: ["backend:build"]
  script:
    - ./gradlew dependencyCheckAggregate
  artifacts:
    paths:
      - backend/build/reports/dependency-check-report.html
      - backend/build/reports/dependency-check-report.sarif
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# ---- Distroless image build + push (Kaniko, privileged/dind gerektirmez) ----
# Dockerfile: service-template/Dockerfile, context = backend/ (multi-module build).
# Yeni servis eklerken bu job'i kopyalayip --dockerfile / --destination yolunu degistir.
backend:image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["backend:build"]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/backend"
      --dockerfile "$CI_PROJECT_DIR/backend/service-template/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/service-template:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/service-template:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [backend/**/*]
    - if: $CI_COMMIT_TAG

# ---- Deploy — PLACEHOLDER (manuel). K8s manifest/helm eklenince doldurulacak. ----
deploy:staging:
  stage: deploy
  image: alpine:3.20
  needs: ["backend:image"]
  script:
    - echo "PLACEHOLDER: deploy henuz tanimli degil (K8s manifest/helm chart bekliyor)."
    - echo "Push edilen image: $CI_REGISTRY_IMAGE/service-template:$CI_COMMIT_SHORT_SHA"
    - echo "Yapilacak: helm upgrade --install ...  /  kubectl set image ..."
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
