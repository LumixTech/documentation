# Lumix backend — Gradle davranış ayarları.
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache kapalı: protobuf-gradle-plugin (0.10.0) henüz CC-uyumlu değil.
# gRPC modülünü çıkarırsan açabilirsin.
org.gradle.configuration-cache=false
# Toolchain otomatik indirme (Foojay) — dev makinesinde JDK 25 yoksa Gradle indirir.
org.gradle.java.installations.auto-download=true
