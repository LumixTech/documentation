# Production. Tüm bağlantı bilgileri environment variable / K8s Secret'tan gelir.
spring:
  datasource:
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.lumix: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
