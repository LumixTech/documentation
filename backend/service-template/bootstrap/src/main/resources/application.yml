# =====================================================================
# service-template — varsayılan (paylaşılan) config. Lumix standart şablonu.
# Sırlar BURAYA YAZILMAZ; environment variable / K8s Secret'tan gelir.
# Profile'lar: dev (varsayılan), test, staging, prod.
# =====================================================================
spring:
  application:
    name: ${SERVICE_NAME:service-template}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Java 25 virtual threads — Tomcat request executor + @Async virtual thread.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:template_db}
    username: ${DB_USER:template}
    password: ${DB_PASSWORD:template}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate # şemadan Flyway sorumlu; JPA DDL üretmez
    open-in-view: false # N+1 / lazy-in-view tuzağını kapat
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
      compression-type: snappy
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

# net.devh gRPC server (bkz. 03-grpc-service-communication)
grpc:
  server:
    port: ${GRPC_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true # K8s liveness/readiness (/actuator/health/liveness|readiness)
      group:
        readiness:
          include: readinessState, db # DB hazır değilse pod trafik almasın
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}

lumix:
  kafka:
    domain-events-topic: ${DOMAIN_EVENTS_TOPIC:sample.domain-events}
    inbound-topic: ${INBOUND_TOPIC:sample.commands}

logging:
  level:
    root: INFO
    com.lumix: INFO
